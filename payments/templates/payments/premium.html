{% extends 'base.html' %}

{% block title %}Premium{% endblock %}

{% block content %}
    <h1>Premium Membership</h1>

    {% if profile.is_premium %}
        <p>You are already a premium member.</p>
    {% else %}
        <p>Upgrade to premium to unlock unlimited puzzle tracking.</p>
        
        <form action="{% url 'create_checkout_session' %}" method="post">
            {% csrf_token %}
            <button type="submit">Upgrade to Premium</button>
        </form>
    {% endif %}
{% endblock %}
