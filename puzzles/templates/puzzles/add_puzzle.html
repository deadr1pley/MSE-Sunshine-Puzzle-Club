{% extends 'base.html' %}

{% block title %}Add Puzzle{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 bg-white">
            <div class="card-body">
                <h2 class="mb-4 text-center">Add New Puzzle</h2>

                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        {{ form.title }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Puzzle Type</label>
                        {{ form.puzzle_type }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Difficulty</label>
                        {{ form.difficulty }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Pieces</label>
                        {{ form.pieces }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        {{ form.status }}
                    </div>

                    <button type="submit" class="btn btn-warning w-100">
                        Save Puzzle
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
